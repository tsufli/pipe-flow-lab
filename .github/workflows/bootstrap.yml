name: Install Pipe Flow Lab starter
on:
  push:
    branches: [main]
    paths:
      - '.bootstrap/READY'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract and commit project files
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/READY
          cat .bootstrap/chunk*.b64 | base64 -d > .bootstrap/seed.tar.xz
          echo "7f3cf73faafa56e9d6391cc35aff052425ac43fa42f0906f1da75c73ea09eade  .bootstrap/seed.tar.xz" | sha256sum -c -
          tar -xJf .bootstrap/seed.tar.xz
          rm -rf .bootstrap
          echo 'Bootstrap workflow removal is performed separately by the GitHub connector'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Install 3D pipe-flow DNS simulator and dashboard'
          git push origin HEAD:main
