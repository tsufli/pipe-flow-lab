name: Barkley short-length ensemble at r=0.6
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: write
concurrency:
  group: barkley-short-puffs
  cancel-in-progress: false
jobs:
  ensemble:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install numpy scipy numba
      - name: Validate short-puff science and code
        run: python -m unittest discover -s tests -p 'test_barkley_shortlength.py' -v
      - name: Simulate 2000 natural puffs and up to 600 genuine-puff restarts
        run: python scripts/barkley_shortlength.py --runs 2000 --T 300 --parents 100 --branches 6 --branch-T 60 --sigma 0.5 --seed 20261129
      # Data are committed by Actions; an ordinary source-code push publishes Pages.
      - name: Commit reproducible dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/barkley/front-tracking/data/shortlength_r_0.6.json
          if ! git diff --cached --quiet; then
            git commit -m "data: 2000 natural trajectories and genuine puff restarts at r=0.6"
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
            done
          fi
