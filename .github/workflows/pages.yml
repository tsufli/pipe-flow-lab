name: Publish results dashboard
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - Run 3D pipe DNS
      - Initial 3D pipe DNS integration run
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pipe-flow-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build archive index and site
        run: python scripts/build_site.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
