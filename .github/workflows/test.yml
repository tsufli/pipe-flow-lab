name: Check analysis and dashboard
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install analysis dependencies
        run: python -m pip install 'numpy>=2.0' 'matplotlib>=3.9,<4' 'pyyaml>=6'
      - name: Run physical smoke tests
        run: python -m unittest discover -s tests -v
      - name: Check workflow YAML and build site
        run: |
          python - <<'PY'
          import yaml
          for name in ['simulate','pages','test']:
              with open(f'.github/workflows/{name}.yml') as f:
                  data = yaml.safe_load(f)
                  assert isinstance(data,dict) and 'jobs' in data
          PY
          python scripts/build_site.py
          test -f _site/index.html
          test -f _site/index.json
